services:
  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: rag-qdrant
    ports:
      - "127.0.0.1:6335:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 30s
      timeout: 5s
      retries: 3

  ml:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: rag-ml
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      MAXP_PER_DEPT: "on"
      CE_FINAL_LIMIT: "10"
      RAW_FLOOR: "-999.0"
      SCORE_HIGH: "0.347"
      GAP_HIGH: "0.004"
      GAP_MIN: "0.001"
    volumes:
      - hf_cache:/root/.cache/huggingface
      - appeals_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: rag-bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ML_API_URL: http://ml:8000
    depends_on:
      ml:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_data:
  hf_cache:
  appeals_data:
